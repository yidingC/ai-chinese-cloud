<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>对话补全 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-dialogue.css">
</head>
<body data-page="activity" data-activity-type="dialogue">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" data-activity-back aria-label="返回课堂互动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>对话补全</span><span class="header-subtitle" data-activity-subtitle>Lengkapi dialog</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="dialogue-stage">
        <section class="dialogue-card" data-dialogue-card aria-label="对话补全">
          <ul class="dialogue-thread" data-dialogue-thread>
            <li class="dialogue-turn is-them">
              <span class="dialogue-avatar" aria-hidden="true">🧑</span>
              <div class="dialogue-turn-body">
                <span class="dialogue-sr">对方说：</span>
                <p class="dialogue-bubble" data-dialogue-them data-dialogue-them-id="Permisi, di mana kamar kecilnya?">请问，洗手间在哪儿？</p>
              </div>
            </li>
            <li class="dialogue-turn is-me">
              <div class="dialogue-turn-body">
                <span class="dialogue-sr">我说：</span>
                <div class="dialogue-me-row">
                  <p class="dialogue-bubble is-placeholder" data-dialogue-me aria-live="polite">？</p>
                  <span class="dialogue-mark hidden" data-dialogue-mark aria-hidden="true">✓</span>
                </div>
              </div>
            </li>
          </ul>

          <div class="dialogue-options" role="group" aria-label="选出合适的下一句" data-dialogue-options></div>

          <button type="button" class="primary-button dialogue-submit btn-stacked" data-dialogue-submit disabled>
            <span data-dialogue-submit-label>提交</span>
            <span class="btn-id" lang="id" data-dialogue-submit-label-id>Kirim</span>
          </button>
        </section>

        <!-- 回执条：卡片的下一层兄弟。未提交时 hidden；提交后从卡片底下滑出 -->
        <div class="dialogue-feedback hidden" role="status" aria-live="polite" tabindex="-1" data-dialogue-feedback>
          <strong class="dialogue-feedback-title hidden" data-dialogue-feedback-title-row>
            <span aria-hidden="true" data-dialogue-feedback-icon></span>
            <span data-dialogue-feedback-title></span>
          </strong>
          <div class="dialogue-quote hidden" data-dialogue-quote>
            <p class="dialogue-quote-row">
              <span class="dialogue-quote-zh" data-dialogue-quote-question-zh></span>
              <span class="dialogue-quote-id" lang="id" data-dialogue-quote-question-id></span>
            </p>
            <p class="dialogue-quote-row is-answer">
              <span class="dialogue-quote-zh" data-dialogue-quote-answer-zh></span>
              <span class="dialogue-quote-id" lang="id" data-dialogue-quote-answer-id></span>
            </p>
          </div>
        </div>
      </div>

      <p class="dialogue-sr" role="status" aria-live="polite" data-activity-status>当前状态：待作答</p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="interaction-dialogue.js"></script>
</body>
</html>
