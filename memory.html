<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>记忆翻牌 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="memory.css">
</head>
<body data-page="memory" data-requires-open="true">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" aria-label="返回课堂互动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>记忆翻牌</span><span class="header-subtitle" data-activity-subtitle>Kartu memori</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <p class="memory-announcer" data-memory-progress role="status" aria-live="polite">已找到 0 / 4 对</p>

      <!-- 轮内多题：进度行。不是轮内时整块不出现（由 shared/round-flow.js 管） -->
      <div class="round-progress hidden" data-round-progress>
        <span class="round-progress-dots" data-round-dots aria-hidden="true"></span>
        <p class="round-progress-text" data-round-text></p>
      </div>

      <section class="memory-grid" data-memory-grid aria-label="中文和印尼语问候语翻牌配对"></section>

      <!-- 轮内多题：【下一题 / Lanjut】。轮内进场就摆着（灰、点不动），翻满 4 对才变紫可点；题型体验时整块不出现 -->
      <div class="memory-next hidden" data-memory-next>
        <button type="button" class="primary-button btn-stacked" data-memory-next-btn disabled>
          <span data-memory-next-label>下一题</span>
          <span class="btn-id" lang="id" data-memory-next-label-id>Lanjut</span>
        </button>
      </div>
    </main>
  </div>

  <script type="module" src="shared/seed-data.js"></script>
  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/platform-store.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="round-content.js"></script>
  <script type="module" src="shared/round-flow.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
