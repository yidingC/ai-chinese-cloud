<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>课堂互动 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="classroom.css">
</head>
<body data-page="classroom">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="clsStarShape" d="M10.41 4.98Q12 2.55 13.59 4.98L13.91 5.48Q15.25 7.53 17.61 8.17L18.19 8.32Q20.99 9.08 19.17 11.34L18.79 11.8Q17.26 13.71 17.38 16.16L17.41 16.75Q17.55 19.65 14.84 18.61L14.29 18.4Q12 17.53 9.71 18.4L9.16 18.61Q6.45 19.65 6.59 16.75L6.62 16.16Q6.74 13.71 5.21 11.8L4.83 11.34Q3.01 9.08 5.81 8.32L6.39 8.17Q8.75 7.53 10.09 5.48L10.41 4.98Z"/>
      <clipPath id="clsStarClip">
        <path d="M10.41 4.98Q12 2.55 13.59 4.98L13.91 5.48Q15.25 7.53 17.61 8.17L18.19 8.32Q20.99 9.08 19.17 11.34L18.79 11.8Q17.26 13.71 17.38 16.16L17.41 16.75Q17.55 19.65 14.84 18.61L14.29 18.4Q12 17.53 9.71 18.4L9.16 18.61Q6.45 19.65 6.59 16.75L6.62 16.16Q6.74 13.71 5.21 11.8L4.83 11.34Q3.01 9.08 5.81 8.32L6.39 8.17Q8.75 7.53 10.09 5.48L10.41 4.98Z"/>
      </clipPath>
      <linearGradient id="clsStarGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe08a"/>
        <stop offset=".48" stop-color="#ffc433"/>
        <stop offset="1" stop-color="#e89709"/>
      </linearGradient>
      <linearGradient id="clsShineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="clsTrophyGold" x1="0" y1="2" x2="0" y2="20" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ffe08a"/>
        <stop offset=".48" stop-color="#ffc433"/>
        <stop offset="1" stop-color="#e89709"/>
      </linearGradient>
      <g id="clsTrophyShape">
        <path d="M6.4 2.2h11.2v6.3a5.6 5.6 0 0 1-11.2 0z" stroke="none"/>
        <rect x="10.7" y="13.9" width="2.6" height="3" rx=".6" stroke="none"/>
        <rect x="6.4" y="16.9" width="11.2" height="3" rx="1.4" stroke="none"/>
        <path d="M6.4 4H4.3a2.7 2.7 0 0 0 2.5 4.8" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M17.6 4h2.1a2.7 2.7 0 0 1-2.5 4.8" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <clipPath id="clsTrophyClip">
        <path d="M6.4 2.2h11.2v6.3a5.6 5.6 0 0 1-11.2 0z"/>
        <rect x="10.7" y="13.9" width="2.6" height="3" rx=".6"/>
        <rect x="6.4" y="16.9" width="11.2" height="3" rx="1.4"/>
      </clipPath>
    </defs>
  </svg>

  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="index.html" aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>课堂互动<span class="header-subtitle">Interaksi Kelas</span></h1>
      <button type="button" class="icon-button" data-classroom-reset aria-label="重来一遍">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 5 2 11 8 11"/><path d="M4.6 15a9 9 0 1 0 2-9.5L2 11"/></svg>
      </button>
    </header>

    <main class="page page-content cls-page">
      <div class="cls-strip" data-phase="live">
        <div class="cls-strip-top">
          <span class="cls-guide" aria-hidden="true">🐼</span>
          <span class="cls-lesson-chip" data-lesson-chip hidden></span>
          <strong class="cls-strip-lesson">嗨！你好！</strong>
          <span class="cls-stars" data-stars aria-hidden="true">
            <svg class="cls-star" viewBox="0 0 24 24"><use href="#clsStarShape"/><g clip-path="url(#clsStarClip)"><rect class="cls-shine" x="0" y="-6" width="7" height="36"/></g></svg>
            <svg class="cls-star" viewBox="0 0 24 24"><use href="#clsStarShape"/><g clip-path="url(#clsStarClip)"><rect class="cls-shine" x="0" y="-6" width="7" height="36"/></g></svg>
            <svg class="cls-star" viewBox="0 0 24 24"><use href="#clsStarShape"/><g clip-path="url(#clsStarClip)"><rect class="cls-shine" x="0" y="-6" width="7" height="36"/></g></svg>
          </span>
        </div>
        <div class="cls-rank is-waiting" data-rank-line role="status" aria-live="polite">
          <span class="cls-rank-trophy" aria-hidden="true">
            <svg class="cls-trophy" viewBox="0 0 24 24"><use href="#clsTrophyShape" fill="url(#clsTrophyGold)" stroke="url(#clsTrophyGold)"/><g clip-path="url(#clsTrophyClip)"><rect class="cls-shine" x="0" y="-6" width="7" height="36"/></g></svg>
          </span>
          <span class="cls-rank-label">得分排名</span>
          <span class="cls-rank-num" data-rank-num><span class="cls-roll">等你上榜</span></span>
          <span class="cls-rank-sep" data-rank-sep hidden>/ 40 ·</span>
          <span class="cls-rank-score" data-rank-score hidden><span class="cls-roll">0分</span></span>
        </div>
      </div>

      <section class="cls-levels" aria-label="课堂互动任务">
        <button type="button" class="cls-level" data-tone="violet" data-level="1" data-state="todo">
          <span class="cls-level-badge" data-badge>1</span>
          <span class="cls-level-copy">
            <span class="cls-level-title">打招呼</span>
            <span class="cls-level-id">Sapaan</span>
            <span class="cls-class-count" data-level-count data-start="21">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3.6 19a5.4 5.4 0 0 1 10.8 0"></path><circle cx="16.8" cy="8.6" r="2.6" opacity=".6"></circle><path d="M13.8 19a5 5 0 0 1 10 0" opacity=".6"></path></svg>
              <b data-count-num>21</b><span class="cls-count-total">/40</span>
            </span>
          </span>
          <span class="cls-level-action is-play" data-action aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 4.6v14.8l12.2-7.4z"/></svg>
          </span>
        </button>

        <span class="cls-link" aria-hidden="true">
          <svg viewBox="0 0 78 58" fill="none" stroke="#d5d1e6" stroke-width="3.5" stroke-dasharray="6 8" stroke-linecap="round"><line x1="10" y1="5" x2="68" y2="53"/></svg>
        </span>

        <button type="button" class="cls-level" data-tone="mint" data-level="2" data-state="todo">
          <span class="cls-level-badge" data-badge>2</span>
          <span class="cls-level-copy">
            <span class="cls-level-title">看图认词</span>
            <span class="cls-level-id">Kenali gambar</span>
            <span class="cls-class-count" data-level-count data-start="11" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3.6 19a5.4 5.4 0 0 1 10.8 0"></path><circle cx="16.8" cy="8.6" r="2.6" opacity=".6"></circle><path d="M13.8 19a5 5 0 0 1 10 0" opacity=".6"></path></svg>
              <b data-count-num>11</b><span class="cls-count-total">/40</span>
            </span>
          </span>
          <span class="cls-level-action is-play" data-action aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 4.6v14.8l12.2-7.4z"/></svg>
          </span>
        </button>

        <span class="cls-link" aria-hidden="true">
          <svg viewBox="0 0 78 58" fill="none" stroke="#d5d1e6" stroke-width="3.5" stroke-dasharray="6 8" stroke-linecap="round"><line x1="68" y1="5" x2="10" y2="53"/></svg>
        </span>

        <button type="button" class="cls-level" data-tone="orange" data-level="3" data-state="todo">
          <span class="cls-level-badge" data-badge>3</span>
          <span class="cls-level-copy">
            <span class="cls-level-title">问候和时间</span>
            <span class="cls-level-id">Sapaan & waktu</span>
            <span class="cls-class-count" data-level-count data-start="4" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3.6 19a5.4 5.4 0 0 1 10.8 0"></path><circle cx="16.8" cy="8.6" r="2.6" opacity=".6"></circle><path d="M13.8 19a5 5 0 0 1 10 0" opacity=".6"></path></svg>
              <b data-count-num>4</b><span class="cls-count-total">/40</span>
            </span>
          </span>
          <span class="cls-level-action is-play" data-action aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M8 4.6v14.8l12.2-7.4z"/></svg>
          </span>
        </button>
      </section>
    </main>
  </div>

          <span class="celebrate-core spark-a" aria-hidden="true" style="--dx: -170px; --dy: -150px; --rot: -160deg; background: #ffd86d; width: 11px; height: 19px;"></span>

        <p class="celebrate-id">Semua sudah selesai! Kamu hebat!</p>
      </div>
      <div class="celebrate-actions">
        <button type="button" class="celebrate-button" data-celebrate-ok>Mantap!</button>
      </div>

  <!-- 速度榜（卡面上那粒 ⚡）：名字 + 用时，只看谁快 -->
  <div class="modal-overlay hidden" data-board-overlay>
    <section class="completion-modal speed-modal" role="dialog" aria-modal="true" aria-labelledby="speed-title" tabindex="-1" data-board-card>
      <button type="button" class="speed-close" data-board-close aria-label="关闭">×</button>
      <div class="speed-badge" aria-hidden="true"><span data-board-icon>⚡</span></div>
      <p class="speed-title" id="speed-title">速度榜</p>
      <ul class="speed-list" data-board-list></ul>
      <p class="speed-me is-waiting" data-board-me hidden></p>
    </section>
  </div>
