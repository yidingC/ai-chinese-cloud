<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>听音选图/选词 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-listening.css">
</head>
<body data-page="activity" data-activity-type="listening">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="index.html" data-activity-back aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>听音选图/选词</span><span class="header-subtitle" data-activity-subtitle>Dengar dan pilih</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="listening-stage">
        <section class="listening-card" aria-labelledby="listening-prompt">

          <!-- 轮内多题（跨页那一轮）：进度行。不是轮内时整块不出现（由 shared/round-flow.js 管） -->
          <div class="round-progress hidden" data-round-progress>
            <span class="round-progress-dots" data-round-dots aria-hidden="true"></span>
            <p class="round-progress-text" data-round-text></p>
          </div>

          <!-- 题面只说给读屏听：页面上让大按钮「🔊 听一听」自己说话 -->
          <p class="listening-sr" id="listening-prompt" data-listening-prompt>听一听，选出你听到的</p>

          <div class="listening-player">
            <button type="button" class="listening-play" data-listening-play aria-label="听一听">
              <span class="listening-play-circle">
                <span class="listening-play-icon" aria-hidden="true">🔊</span>
              </span>
            </button>
            <!-- 占位：src 由题目数据的 audio 字段填入，填上真实录音路径就能真播 -->
            <audio data-listening-audio preload="none"></audio>
          </div>

          <div class="listening-options" role="group" aria-labelledby="listening-prompt" data-listening-options></div>

          <button type="button" class="primary-button listening-submit btn-stacked" data-listening-submit disabled>
            <span data-listening-submit-label>提交</span>
            <span class="btn-id" lang="id" data-listening-submit-label-id>Kirim</span>
          </button>
        </section>

        <!-- 回执条：卡片的下一层兄弟。未提交时 hidden；提交后从卡片底下滑出，只报"正确答案是什么"，
             对错都由完成弹窗说，这条不重复鼓励、不放图标 -->
        <div class="listening-receipt hidden" data-listening-receipt>
          <p class="listening-receipt-line">
            <span class="listening-receipt-text" data-listening-receipt-text></span>
            <span class="listening-receipt-read" data-listening-receipt-read>
              <span class="listening-receipt-pinyin" data-listening-receipt-pinyin></span>
              <i class="listening-receipt-dot" aria-hidden="true" data-listening-receipt-dot>·</i>
              <span class="listening-receipt-meaning" lang="id" data-listening-receipt-meaning></span>
            </span>
          </p>
        </div>
      </div>

      <p class="listening-announcer" data-listening-announcer role="status" aria-live="polite"></p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="round-content.js"></script>
  <script type="module" src="shared/round-flow.js"></script>
  <script type="module" src="interaction-listening.js"></script>
</body>
</html>
