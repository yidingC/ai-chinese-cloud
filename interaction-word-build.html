<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4fb">
  <title>拼字/组词 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-word-build.css">
</head>
<body data-page="activity" data-activity-type="word-build">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" data-activity-back aria-label="返回课堂互动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>拼字/组词</span><span class="header-subtitle" data-activity-subtitle>Susun hanzi jadi kata</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="word-stage">
        <section class="word-card">
          <!-- 轮内多题（跨页那一轮）：进度行。不是轮内时整块不出现（由 shared/round-flow.js 管） -->
          <div class="round-progress hidden" data-round-progress>
            <span class="round-progress-dots" data-round-dots aria-hidden="true"></span>
            <p class="round-progress-text" data-round-text></p>
          </div>

          <!-- 题目牌：全页唯一“说话的人”，emoji + 印尼语词就是题面 -->
          <div class="word-hint">
            <span class="word-hint-slot" data-word-hint-slot></span>
            <strong class="word-hint-meaning" data-word-hint-meaning>ibu</strong>
          </div>

          <section class="word-answer-area" aria-label="作答区">
            <div class="word-slots" data-word-slots></div>
          </section>

          <section class="word-bank-area" aria-label="字块区">
            <div class="word-bank" data-word-bank></div>
          </section>

          <div class="word-actions">
            <button type="button" class="secondary-button btn-stacked" data-word-reset>
              <span data-word-reset-label>重置</span>
              <span class="btn-id" lang="id">Ulangi</span>
            </button>
            <button type="button" class="primary-button btn-stacked" data-word-submit disabled>
              <span data-word-submit-label>提交</span>
              <span class="btn-id" lang="id" data-word-submit-label-id>Kirim</span>
            </button>
          </div>
        </section>

        <!-- 回执条：卡片的下一层兄弟。未提交时 hidden；提交后从卡片底下滑出 -->
        <div class="word-feedback hidden" role="status" aria-live="polite" data-word-feedback>
          <strong class="word-feedback-title">
            <span aria-hidden="true" data-word-feedback-icon></span>
            <span data-word-verdict></span>
          </strong>
          <p class="word-feedback-answer" data-word-feedback-answer></p>
        </div>
      </div>

      <p class="word-live" role="status" aria-live="polite" data-activity-status></p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="round-content.js"></script>
  <script type="module" src="shared/round-flow.js"></script>
  <script type="module" src="interaction-word-build.js"></script>
</body>
</html>
