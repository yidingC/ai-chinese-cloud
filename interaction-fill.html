<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>补全句子 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-fill.css">
</head>
<body data-page="activity" data-activity-type="fill">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" data-activity-back aria-label="返回课堂互动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>补全句子</span><span class="header-subtitle" data-activity-subtitle>Lengkapi kalimat</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <div class="fill-stage">
        <section class="fill-card" data-activity-slot data-fill-state="idle" aria-label="补全句子作答区">
          <p class="fill-sentence" data-fill-sentence lang="zh-CN"></p>
          <div class="fill-bank" data-fill-bank role="group" aria-label="词库，点一个词把它填进空格"></div>

          <div class="fill-actions">
            <button type="button" class="secondary-button fill-clear btn-stacked" data-fill-clear disabled>
              <span data-fill-clear-label>重置</span>
              <span class="btn-id" lang="id">Ulangi</span>
            </button>
            <button type="button" class="primary-button fill-submit btn-stacked" data-fill-submit disabled>
              <span data-fill-submit-label>提交</span>
              <span class="btn-id" lang="id" data-fill-submit-label-id>Kirim</span>
            </button>
          </div>
        </section>

        <!-- 回执条：从卡片底下滑出。绝对定位、不占位；平时整条压在卡片下沿后面 -->
        <div class="fill-feedback hidden" role="status" aria-live="polite" data-fill-feedback>
          <strong class="fill-feedback-title">
            <span aria-hidden="true" data-fill-feedback-icon></span>
            <span data-fill-verdict></span>
          </strong>
          <p class="fill-feedback-sentence hidden" data-fill-full-sentence></p>
          <p class="fill-feedback-translation hidden" data-fill-full-sentence-id lang="id"></p>
        </div>
      </div>

      <p class="fill-live" data-fill-live role="status" aria-live="polite"></p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="interaction-fill.js"></script>
</body>
</html>
