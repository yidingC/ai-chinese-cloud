<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>看图单选 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-picture.css">
</head>
<body data-page="activity" data-activity-type="picture">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" data-activity-back aria-label="返回课堂">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>看图单选</span><span class="header-subtitle" data-activity-subtitle>Pilih gambar</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="picture-stage">
        <section class="picture-card" data-picture-card aria-labelledby="picture-question">
          <!-- 轮内多题（跨页那一轮）：进度行。不是轮内时整块不出现（由 shared/round-flow.js 管） -->
          <div class="round-progress hidden" data-round-progress>
            <span class="round-progress-dots" data-round-dots aria-hidden="true"></span>
            <p class="round-progress-text" data-round-text></p>
          </div>

          <div class="picture-stem">
            <p class="picture-pinyin" data-picture-pinyin>Zhè shì shénme?</p>
            <h3 class="picture-question" id="picture-question" data-picture-question>这是什么？</h3>
          </div>

          <figure class="picture-figure">
            <div class="picture-slot" data-picture-slot></div>
          </figure>

          <div class="picture-options" role="group" aria-labelledby="picture-question" data-picture-options></div>

          <button type="button" class="primary-button picture-submit btn-stacked" data-picture-submit disabled>
            <span data-picture-submit-label>提交</span>
            <span class="btn-id" lang="id" data-picture-submit-label-id>Kirim</span>
          </button>
        </section>

        <!-- 回执条：卡片的下一层兄弟。未提交时 hidden；提交后从卡片底下滑出 -->
        <div class="picture-feedback hidden" role="status" aria-live="polite" tabindex="-1" data-picture-feedback>
          <strong class="picture-feedback-title">
            <span aria-hidden="true" data-picture-feedback-icon></span>
            <span data-picture-feedback-title></span>
          </strong>
          <p class="picture-feedback-answer hidden" data-picture-feedback-answer></p>
        </div>
      </div>

      <p class="picture-announcer" role="status" aria-live="polite" data-activity-status>当前状态：待作答</p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="round-content.js"></script>
  <script type="module" src="shared/round-flow.js"></script>
  <script type="module" src="interaction-picture.js"></script>
</body>
</html>
