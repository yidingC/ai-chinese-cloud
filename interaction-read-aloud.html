<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>跟读模仿 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-read-aloud.css">
</head>
<body data-page="activity" data-activity-type="read-aloud">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="index.html" data-activity-back aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>跟读模仿</span><span class="header-subtitle" data-activity-subtitle>Tirukan bacaan</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="read-aloud-stage">
        <section class="read-aloud-card" aria-labelledby="read-aloud-sr">
          <!-- 熊猫出题：站在那儿出题的角色，表情只写在 --avatar-glyph 一处 -->
          <div class="read-aloud-panda" aria-hidden="true"></div>

          <!-- 题面只说给读屏听：页面上让话语盒和两个按钮自己说话 -->
          <p class="read-aloud-sr" id="read-aloud-sr" data-read-aloud-prompt>听一遍，然后跟着读</p>

          <!-- 这个气泡 = 熊猫说出来的话：听范读是熊猫念给你听，按住说话是你念给它听。
               一个页面只有这一只熊猫、这一个气泡，别再加第二个角色。
               气泡里只放"要读的东西"（你好 + 拼音），鼓励不在这里。 -->
          <div class="read-aloud-plate">
            <!-- 范读＝多邻国式裸喇叭：贴在第一行文字左边，整组居中；点击热区靠 padding 撑够 -->
            <p class="read-aloud-line">
              <button type="button" class="read-aloud-speaker" data-read-aloud-listen aria-label="听范读">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M11 5 6 9H3v6h3l5 4V5z"/>
                  <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                  <path d="M18.5 6a9 9 0 0 1 0 12"/>
                </svg>
              </button>
              <span class="read-aloud-text" lang="zh-CN" data-read-aloud-text>你好</span>
            </p>
            <p class="read-aloud-pinyin" data-read-aloud-pinyin>nǐ hǎo</p>
          </div>
        </section>

        <!-- 回执条：只夸"开口说了"，不评价结果；出结果时从卡片下沿滑出来（见 js / css） -->
        <div class="read-aloud-result hidden" data-read-aloud-result tabindex="-1">
          <p class="read-aloud-cheer hidden" data-read-aloud-cheer-row>
            <span data-read-aloud-cheer>说得不错！</span>
            <i class="read-aloud-cheer-dot" aria-hidden="true">·</i>
            <span class="read-aloud-cheer-id" lang="id" data-read-aloud-cheer-id>Bagus!</span>
          </p>
        </div>
      </div>

      <!-- 贴底动作区：一行小字（状态都靠它说）→ 通栏麦克风 -->
      <div class="read-aloud-actions">
        <p class="read-aloud-hint" data-read-aloud-hint>按住读完松开 · Tahan, baca, lalu lepas</p>
        <!-- 视觉上只有麦克风；名字靠 aria-label 给读屏（见 js），不留可见文字 -->
        <button type="button" class="read-aloud-record-button" data-read-aloud-record aria-label="按住说话" aria-pressed="false" aria-busy="false">
          <span class="read-aloud-record-icon" aria-hidden="true" data-read-aloud-record-icon>🎤</span>
        </button>
      </div>

      <p class="read-aloud-announcer" data-read-aloud-announcer role="status" aria-live="polite"></p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="interaction-read-aloud.js"></script>
</body>
</html>
