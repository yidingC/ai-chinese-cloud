<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>情景选择 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-situation.css">
</head>
<body data-page="activity" data-activity-type="situation">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" data-activity-back aria-label="返回课堂互动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>情景选择</span><span class="header-subtitle" data-activity-subtitle>Situasi dan ucapan</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="situation-stage">
        <section class="situation-card" data-situation-card aria-labelledby="situation-scene">
          <!-- 轮内多题（跨页那一轮）：进度行。不是轮内时整块不出现（由 shared/round-flow.js 管） -->
          <div class="round-progress hidden" data-round-progress>
            <span class="round-progress-dots" data-round-dots aria-hidden="true"></span>
            <p class="round-progress-text" data-round-text></p>
          </div>

          <div class="situation-scene">
            <div class="situation-slot" data-situation-slot></div>
            <h2 class="situation-scene-text" id="situation-scene" data-situation-scene-text></h2>
            <p class="situation-scene-id" lang="id" data-situation-scene-id></p>
          </div>

          <p class="situation-sr" data-situation-options-label>选一句最得体的说法。</p>
          <div class="situation-options" role="group" aria-labelledby="situation-options-label" data-situation-options></div>

          <button type="button" class="primary-button situation-submit btn-stacked" data-situation-submit disabled>
            <span data-situation-submit-label>提交</span>
            <span class="btn-id" lang="id" data-situation-submit-label-id>Kirim</span>
          </button>
        </section>

        <!-- 回执条：卡片的下一层兄弟。未提交时 hidden；提交后从卡片底下滑出 -->
        <div class="situation-feedback hidden" role="status" aria-live="polite" tabindex="-1" data-situation-feedback>
          <strong class="situation-feedback-title hidden" data-situation-feedback-title-row>
            <span aria-hidden="true" data-situation-feedback-icon></span>
            <span data-situation-feedback-title></span>
          </strong>
          <p class="situation-feedback-sentence" data-situation-feedback-sentence></p>
          <p class="situation-feedback-translation" lang="id" data-situation-feedback-translation></p>
        </div>
      </div>

      <p class="situation-sr" role="status" aria-live="polite" data-activity-status>当前状态：待作答</p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="round-content.js"></script>
  <script type="module" src="shared/round-flow.js"></script>
  <script type="module" src="interaction-situation.js"></script>
</body>
</html>
