<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>句子排序 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-order.css">
</head>
<body data-page="activity" data-activity-type="order">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" data-activity-back aria-label="返回课堂互动">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>句子排序</span><span class="header-subtitle" data-activity-subtitle>Urutkan kalimat</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <div class="order-stage">
        <section class="order-card" aria-labelledby="order-scene">
          <!-- 轮内多题（跨页那一轮）：进度行。不是轮内时整块不出现（由 shared/round-flow.js 管） -->
          <div class="round-progress hidden" data-round-progress>
            <span class="round-progress-dots" data-round-dots aria-hidden="true"></span>
            <p class="round-progress-text" data-round-text></p>
          </div>

          <p class="order-scene" id="order-scene">
            <span class="order-scene-icon" aria-hidden="true">🛒</span>
            <span>你和妈妈在水果店，你想告诉她你要买什么。<span class="order-scene-id" lang="id">Kamu dan ibumu ada di toko buah. Katakan apa yang ingin kamu beli.</span></span>
          </p>
        </section>

        <section class="order-board">
          <section class="order-answer-area" aria-label="答案行">
            <div class="order-answer-line" data-order-answer></div>
          </section>

          <section class="order-bank-area" aria-label="词库">
            <div class="order-bank" data-order-bank></div>
          </section>

          <div class="order-actions">
            <button type="button" class="secondary-button btn-stacked" data-order-clear>
              <span data-order-clear-label>重置</span>
              <span class="btn-id" lang="id">Ulangi</span>
            </button>
            <button type="button" class="primary-button btn-stacked" data-order-submit disabled>
              <span data-order-submit-label>提交</span>
              <span class="btn-id" lang="id" data-order-submit-label-id>Kirim</span>
            </button>
          </div>
        </section>

        <section class="order-feedback hidden" data-order-feedback tabindex="-1" aria-label="本题反馈"></section>
      </div>

      <p class="order-announcer" data-order-announcer role="status" aria-live="polite"></p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="round-content.js"></script>
  <script type="module" src="shared/round-flow.js"></script>
  <script type="module" src="interaction-order.js"></script>
</body>
</html>
