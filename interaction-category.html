<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>分类归组 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-category.css">
</head>
<body data-page="activity" data-activity-type="category">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="index.html" data-activity-back aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>分类归组</span><span class="header-subtitle" data-activity-subtitle>Kelompokkan kata</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="category-stage">
        <section class="category-card" aria-labelledby="category-prompt">
          <div class="category-prompt-block">
            <h3 class="category-prompt" id="category-prompt"><span aria-hidden="true">🐼</span>把下面的词放进对应的类别里吧！</h3>
            <p class="category-prompt-id" lang="id">Ayo, kelompokkan kata-kata di bawah ini ke kategori yang tepat!</p>
          </div>

          <div class="category-pool-block">
            <div class="category-pool" role="group" aria-label="待归类的词" data-category-pool></div>
          </div>

          <div class="category-groups" data-category-groups></div>

          <div class="category-actions">
            <button type="button" class="secondary-button btn-stacked" data-category-reset>
              <span data-category-reset-label>重置</span>
              <span class="btn-id" lang="id">Ulangi</span>
            </button>
            <button type="button" class="primary-button btn-stacked" data-category-submit disabled>
              <span data-category-submit-label>提交</span>
              <span class="btn-id" lang="id" data-category-submit-label-id>Kirim</span>
            </button>
          </div>
        </section>

        <!-- 回执条：卡片的下一层兄弟。未提交时 hidden；提交后从卡片底下滑出 -->
        <div class="category-feedback hidden" role="status" aria-live="polite" tabindex="-1" data-category-feedback>
          <strong class="category-feedback-title">
            <span data-category-feedback-title></span>
            <span class="category-feedback-title-sep" aria-hidden="true">·</span>
            <span class="category-feedback-title-id" lang="id" data-category-feedback-title-id></span>
          </strong>
        </div>
      </div>

      <p class="category-announcer" role="status" aria-live="polite" data-category-announcer></p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="interaction-category.js"></script>
</body>
</html>
