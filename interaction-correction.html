<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>找错误/改错 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-correction.css">
</head>
<body data-page="activity" data-activity-type="correction">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="classroom.html" data-activity-back aria-label="返回课堂">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>找错误/改错</span><span class="header-subtitle" data-activity-subtitle>Temukan yang salah</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，出结果才滑出来 -->
      <div class="correction-stage">
        <section class="correction-card" aria-labelledby="correction-prompt">

          <!-- 题面：卡片里、句子框正上方的一行（中文短句 + 印尼语小字），
               同时是卡片和句子组的无障碍标题 -->
          <div class="correction-prompt-block">
            <p class="correction-prompt" id="correction-prompt">点出用错的词。</p>
            <p class="correction-prompt-id" lang="id">Ketuk kata yang salah.</p>
          </div>

          <div class="correction-sentence" role="group" aria-labelledby="correction-prompt" data-correction-sentence></div>

          <button type="button" class="primary-button correction-submit btn-stacked" data-correction-submit disabled>
            <span data-correction-submit-label>提交</span>
            <span class="btn-id" lang="id" data-correction-submit-label-id>Kirim</span>
          </button>
        </section>

        <!-- 回执条：卡片的下一层兄弟。未提交时 hidden；提交后从卡片底下滑出 -->
        <div class="correction-feedback hidden" role="status" aria-live="polite" tabindex="-1" data-correction-feedback>
          <strong class="correction-feedback-title hidden" data-correction-feedback-title-row>
            <span aria-hidden="true" data-correction-feedback-icon></span>
            <span data-correction-feedback-title></span>
          </strong>
          <p class="correction-feedback-sentence" data-correction-fixed-sentence></p>
          <p class="correction-feedback-pinyin" data-correction-fixed-pinyin></p>
          <p class="correction-feedback-copy" data-correction-feedback-copy></p>
          <p class="correction-feedback-id" lang="id" data-correction-feedback-id></p>
        </div>
      </div>

      <p class="correction-announcer" data-correction-announcer role="status" aria-live="polite"></p>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="interaction-correction.js"></script>
</body>
</html>
