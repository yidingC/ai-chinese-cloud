<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fc">
  <title>拼音—汉字—含义匹配 · AI Chinese Cloud</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="interaction-pinyin-match.css">
</head>
<body data-page="activity" data-activity-type="pinyin-match">
  <div class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="page-header">
      <a class="icon-button" href="index.html" data-activity-back aria-label="返回课堂">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1><span data-activity-title>拼音—汉字—含义匹配</span><span class="header-subtitle" data-activity-subtitle>Cocokkan pinyin, hanzi, arti</span></h1>
      <span class="header-spacer"></span>
    </header>

    <main class="page page-content">
      <!-- 轮内多题（跨页那一轮）：进度行。不是轮内时整块不出现（由 shared/round-flow.js 管） -->
      <div class="round-progress hidden" data-round-progress>
        <span class="round-progress-dots" data-round-dots aria-hidden="true"></span>
        <p class="round-progress-text" data-round-text></p>
      </div>

      <!-- 卡片 + 回执条：回执条是卡片的下一层，平时整条压在卡片下沿后面，选错才滑出来。
           容器叫 py-receipt-stage —— .py-stage 已经是卡片里"步骤②"那块的名字。 -->
      <div class="py-receipt-stage">
        <section class="py-card" aria-label="拼音、汉字和意思配对作答区">
          <div class="py-plate">
            <p class="py-step is-current" id="py-word-label" data-py-step-word>看拼音选汉字 · Pilih hanzi</p>
            <p class="py-pinyin" data-py-pinyin>shū</p>
          </div>

          <div class="py-options py-options-word" role="group" aria-labelledby="py-word-label" data-py-words></div>

          <div class="py-stage hidden" data-py-meaning-stage>
            <p class="py-step is-current" id="py-meaning-label" data-py-step-meaning>选意思 · Pilih arti</p>
            <div class="py-options py-options-meaning" role="group" aria-labelledby="py-meaning-label" data-py-meanings></div>
          </div>
        </section>

        <!-- 回执条：卡片的下一层兄弟。没选错时 hidden；选错后从卡片底下滑出 -->
        <div class="py-feedback hidden" role="status" aria-live="polite" data-py-feedback>
          <strong class="py-feedback-title" data-py-feedback-title></strong>
          <p class="py-feedback-copy" data-py-feedback-copy></p>
        </div>
      </div>

      <ol class="py-slots" data-py-done-list aria-label="已配好的组合">
        <li class="py-slot" data-py-slot="1" aria-hidden="true"></li>
        <li class="py-slot" data-py-slot="2" aria-hidden="true"></li>
        <li class="py-slot" data-py-slot="3" aria-hidden="true"></li>
      </ol>

      <p class="py-sr" role="status" aria-live="polite" data-activity-status></p>

      <!-- 轮内多题：【下一题 / Lanjut】。轮内进场就摆着（灰、点不动），三组都配好才变紫可点；题型体验时整块不出现 -->
      <div class="py-next hidden" data-py-next>
        <button type="button" class="primary-button btn-stacked" data-py-next-btn disabled>
          <span data-py-next-label>下一题</span>
          <span class="btn-id" lang="id" data-py-next-label-id>Lanjut</span>
        </button>
      </div>
    </main>
  </div>

  <script type="module" src="shared/activity-types.js"></script>
  <script type="module" src="shared/activity-fab.js"></script>
  <script type="module" src="shared/activity-bridge.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="shared/activity-page.js"></script>
  <script type="module" src="shared/feedback-copy.js"></script>
  <script type="module" src="shared/feedback-modal.js"></script>
  <script type="module" src="round-content.js"></script>
  <script type="module" src="shared/round-flow.js"></script>
  <script type="module" src="interaction-pinyin-match.js"></script>
</body>
</html>
